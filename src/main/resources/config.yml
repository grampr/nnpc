settings:
  # auto: use each player's Minecraft language. You can also use ja, en, ja_JP, en_US, etc.
  language: auto
  # Used by the console and by players whose language file is not installed.
  fallback-language: en
  autosave-interval-seconds: 60
  hologram:
    default-height: 0.3
  look-at-player:
    update-interval-ticks: 10
    radius: 8.0
  path:
    update-interval-ticks: 2
    default-speed: 0.2
  debug: false

server-transfer:
  enabled: true
  # Treat a CMD action such as "server lobby" as a proxy server transfer.
  intercept-server-command: true
  # Velocity requires bungee-plugin-message-channel = true in velocity.toml.
  channel: BungeeCord
